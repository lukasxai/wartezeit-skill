# Einstellungen für die Wartezeit. Ohne Leerzeichen um das Gleichheitszeichen.
VERZOEGERUNG=5     # Sekunden, bevor das Fenster aufgeht. Bei kurzen Antworten bleibt es zu.
GLOCKE=ja          # ja oder nein
SCHLIESSEN=ja      # ja oder nein: Fenster schließen, wenn Claude fertig ist
ZIEL=""            # leer = Dashboard. Sonst eine Adresse, die stattdessen aufgeht, z. B. "https://calendar.google.com"
BREITE=560
HOEHE=900
BROWSER=""         # leer = selbst suchen. Sonst voller Pfad zum Browser.
